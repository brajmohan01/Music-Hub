<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<div id="overlay" class="overlay"></div>

    <nav class="navbar">
        <div class="nav-container">
            <div style="display: flex; align-items: center;">
                <button class="hamburger-btn" id="hamburger-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <a href="#" class="nav-logo"><img src="image.png" alt=""> Music Hub</a>
            </div>
            <div class="nav-links">
                <a href="#" class="nav-link">BMS</a>
                <a href="index.html" class="nav-link active">Explore</a>
                <a href="about.html" class="nav-link">About Us</a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <!-- Left Panel for Local MP3s -->
        <div class="local-player-panel" id="local-player-panel">
            <h2>Local Music Files</h2>
            <input type="file" id="folder-input" webkitdirectory directory multiple class="hidden">
            <label for="folder-input" class="scan-button">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>
                <span>Scan Folder</span>
            </label>
            <div id="local-playlist">
                 <p style="text-align: center; color: var(--subtle-text-color); padding: 1rem;">Select a folder to begin.</p>
            </div>
        </div>

        <!-- Right Panel for Server Songs -->
        <div class="server-player-panel">
             <h1>Explore Music</h1>
            <div class="song-grid" id="song-grid">
                <!-- Song cards will be injected here -->
            </div>
        </div>
    </div>
    
    <!-- Single Audio Element for both players -->
    <audio id="audio-player"></audio>

    <!-- Unified Player Bar -->
    <div class="player-bar">
        <div class="player-song-info">
            <img id="player-cover" src="https://placehold.co/100x100/e2e8f0/e2e8f0?text=." alt="Album Cover">
            <div>
                <p id="player-title">Select a song</p>
                <p id="player-artist">...</p>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-buttons">
                <button id="prev-btn" disabled>
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"></path></svg>
                </button>
                <button id="play-pause-btn" disabled>
                    <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
                </button>
                <button id="next-btn" disabled>
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="m16 6 8.5 6-8.5 6V6zm-8.5 12H6V6h1.5v12z"></path></svg>
                </button>
            </div>
            <div class="progress-container">
                <span id="current-time" class="time-display">0:00</span>
                <div id="progress-bar">
                    <div id="progress"></div>
                </div>
                <span id="duration" class="time-display">0:00</span>
            </div>
        </div>
    </div>

   <script src="script.js"></script>
</body>
</html>
